name: ExPro Sync

on:
  schedule:
    - cron: '0 6 * * *'   # щодня о 8:00 за Варшавою (UTC+2)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим запуску'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - scrape
          - sync
          - mieszkania
          - media
          - pipeline

concurrency:
  group: expro-sync
  cancel-in-progress: false   # черга — не скасовувати запущений

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # 6 год — вистачить навіть на перший повний scrape

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Generate config.py from secrets
        env:
          SSH_HOST:          ${{ secrets.SSH_HOST }}
          SSH_PORT:          ${{ secrets.SSH_PORT }}
          SSH_USERNAME:      ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD:      ${{ secrets.SSH_PASSWORD }}
          EXPRO_USERNAME:    ${{ secrets.EXPRO_USERNAME }}
          EXPRO_PASSWORD:    ${{ secrets.EXPRO_PASSWORD }}
          WP_PATH:           ${{ secrets.WP_PATH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL:            ${{ secrets.WP_URL }}
          WP_API_KEY:        ${{ secrets.WP_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os

          cfg = '''# Auto-generated by GitHub Actions — do not commit
          SSH = {{
              "host":     "{SSH_HOST}",
              "port":     {SSH_PORT},
              "username": "{SSH_USERNAME}",
              "password": "{SSH_PASSWORD}",
          }}
          EXPRO = {{
              "base_url":  "https://expro.expander.pl",
              "login_url": "https://expro.expander.pl/user/login",
              "username":  "{EXPRO_USERNAME}",
              "password":  "{EXPRO_PASSWORD}",
          }}
          WP = {{
              "path":        "{WP_PATH}",
              "wp_cli":      "wp",
              "post_type":   "inwestycja",
              "post_status": "publish",
              "post_author": 1,
          }}
          DATA_FILE = "data/expro_data.json"
          PREV_FILE = "data/expro_prev.json"
          LOG_FILE  = "logs/sync.log"
          ANTHROPIC_API_KEY = "{ANTHROPIC_API_KEY}"
          WP_PLUGIN = {{
              "url":     "{WP_URL}",
              "api_key": "{WP_API_KEY}",
          }}
          STATUS_MAP = {{
              "Dostepne":      "dostepne",
              "Zarezerwowane": "zarezerwowane",
              "Sprzedane":     "sprzedane",
          }}
          '''.format(
              SSH_HOST=os.environ['SSH_HOST'],
              SSH_PORT=int(os.environ.get('SSH_PORT', '65002')),
              SSH_USERNAME=os.environ['SSH_USERNAME'],
              SSH_PASSWORD=os.environ['SSH_PASSWORD'],
              EXPRO_USERNAME=os.environ['EXPRO_USERNAME'],
              EXPRO_PASSWORD=os.environ['EXPRO_PASSWORD'],
              WP_PATH=os.environ['WP_PATH'],
              ANTHROPIC_API_KEY=os.environ.get('ANTHROPIC_API_KEY', ''),
              WP_URL=os.environ['WP_URL'],
              WP_API_KEY=os.environ['WP_API_KEY'],
          )
          with open('config.py', 'w') as f:
              f.write(cfg)
          print('config.py created')
          PYEOF

      - name: Restore data cache (expro_prev.json for unit photo dedup)
        uses: actions/cache@v4
        with:
          path: data/expro_prev.json
          key: expro-prev-${{ github.run_id }}
          restore-keys: |
            expro-prev-

      - name: Scrape ExPro data (if needed)
        if: ${{ github.event.inputs.mode != 'all' && github.event.inputs.mode != 'scrape' && github.event.inputs.mode != '' }}
        run: python3 run.py scrape

      - name: Run sync
        run: python3 run.py ${{ github.event.inputs.mode || 'all' }}

      - name: Save data cache (expro_prev.json for next run)
        if: always()
        uses: actions/cache@v4
        with:
          path: data/expro_prev.json
          key: expro-prev-${{ github.run_id }}

      - name: Write job summary
        if: always()
        run: |
          echo "## ExPro Sync — $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Tryb:** \`${{ github.event.inputs.mode || 'all' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/expro_data.json ]; then
            INV=$(python3 -c "import json; d=json.load(open('data/expro_data.json')); print(len(d))" 2>/dev/null || echo "?")
            UNITS=$(python3 -c "import json; d=json.load(open('data/expro_data.json')); print(sum(len(i.get('units',[])) for i in d))" 2>/dev/null || echo "?")
            PHOTOS=$(python3 -c "import json; d=json.load(open('data/expro_data.json')); print(sum(len(u.get('photo_urls',[])) for i in d for u in i.get('units',[])))" 2>/dev/null || echo "?")
            echo "| Metryka | Wartość |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Inwestycji | $INV |" >> $GITHUB_STEP_SUMMARY
            echo "| Lokali (units) | $UNITS |" >> $GITHUB_STEP_SUMMARY
            echo "| Zdjęć lokali | $PHOTOS |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/sync.log ]; then
            echo "### Ostatnie logi" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -60 logs/sync.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ github.run_number }}
          path: |
            logs/
            data/expro_data.json
          retention-days: 14
          if-no-files-found: ignore
