name: Amenity Patch (Phase 2)

# Scrapes balcony/terrace/garden/garage/basement for ExPro units.
# Only new units (not in cache) are scraped — first run is slow, subsequent runs are fast.
# Runs weekly after main ExPro sync, fully automatic.

on:
  schedule:
    - cron: '0 8 * * 1'   # щопонеділка 10:00 Варшава (2 год після основного sync о 8:00)
  workflow_dispatch:
    inputs:
      expro_ids:
        description: 'ExPro IDs (через кому, порожньо = всі)'
        required: false
        default: ''
        type: string

concurrency:
  group: amenity-patch
  cancel-in-progress: false

jobs:
  amenity:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Generate config.py from secrets
        env:
          SSH_HOST:          ${{ secrets.SSH_HOST }}
          SSH_PORT:          ${{ secrets.SSH_PORT }}
          SSH_USERNAME:      ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD:      ${{ secrets.SSH_PASSWORD }}
          EXPRO_USERNAME:    ${{ secrets.EXPRO_USERNAME }}
          EXPRO_PASSWORD:    ${{ secrets.EXPRO_PASSWORD }}
          WP_PATH:           ${{ secrets.WP_PATH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL:            ${{ secrets.WP_URL }}
          WP_API_KEY:        ${{ secrets.WP_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os
          cfg = '''# Auto-generated by GitHub Actions — do not commit
          SSH = {{
              "host":     "{SSH_HOST}",
              "port":     {SSH_PORT},
              "username": "{SSH_USERNAME}",
              "password": "{SSH_PASSWORD}",
          }}
          EXPRO = {{
              "base_url":  "https://expro.expander.pl",
              "login_url": "https://expro.expander.pl/user/login",
              "username":  "{EXPRO_USERNAME}",
              "password":  "{EXPRO_PASSWORD}",
          }}
          WP = {{
              "path":        "{WP_PATH}",
              "wp_cli":      "wp",
              "post_type":   "inwestycja",
              "post_status": "publish",
              "post_author": 1,
          }}
          DATA_FILE = "data/expro_data.json"
          PREV_FILE = "data/expro_prev.json"
          LOG_FILE  = "logs/sync.log"
          ANTHROPIC_API_KEY = "{ANTHROPIC_API_KEY}"
          WP_PLUGIN = {{
              "url":     "{WP_URL}",
              "api_key": "{WP_API_KEY}",
          }}
          STATUS_MAP = {{
              "Dostepne":      "dostepne",
              "Zarezerwowane": "zarezerwowane",
              "Sprzedane":     "sprzedane",
          }}
          '''.format(
              SSH_HOST=os.environ['SSH_HOST'],
              SSH_PORT=int(os.environ.get('SSH_PORT', '65002')),
              SSH_USERNAME=os.environ['SSH_USERNAME'],
              SSH_PASSWORD=os.environ['SSH_PASSWORD'],
              EXPRO_USERNAME=os.environ['EXPRO_USERNAME'],
              EXPRO_PASSWORD=os.environ['EXPRO_PASSWORD'],
              WP_PATH=os.environ['WP_PATH'],
              ANTHROPIC_API_KEY=os.environ.get('ANTHROPIC_API_KEY', ''),
              WP_URL=os.environ['WP_URL'],
              WP_API_KEY=os.environ['WP_API_KEY'],
          )
          with open('config.py', 'w') as f:
              f.write(cfg)
          print('config.py created')
          PYEOF

      # ── expro_data.json: download fresh from server (api_scraper runs daily there) ──
      - name: Download expro_data.json from server
        env:
          SSH_HOST:     ${{ secrets.SSH_HOST }}
          SSH_PORT:     ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          mkdir -p data
          python3 - <<'PYEOF'
          import os, sys, paramiko

          host = os.environ['SSH_HOST']
          port = int(os.environ.get('SSH_PORT', '65002'))
          user = os.environ['SSH_USERNAME']
          pw   = os.environ['SSH_PASSWORD']

          ssh = paramiko.SSHClient()
          ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          ssh.connect(host, port=port, username=user, password=pw, timeout=30)

          # Try api_scraper location first, fall back to legacy scraper location
          candidates = [
              '/home/u525644354/expro_scraper_run/data/expro_data.json',
              '/home/u525644354/expro_sync/data/expro_data.json',
              '/home/u525644354/domains/realsymanagement.pl/public_html/expro_sync/data/expro_data.json',
          ]
          sftp = ssh.open_sftp()
          downloaded = False
          for remote_path in candidates:
              try:
                  sftp.stat(remote_path)
                  sftp.get(remote_path, 'data/expro_data.json')
                  print(f'Downloaded from {remote_path}')
                  downloaded = True
                  break
              except FileNotFoundError:
                  continue
          sftp.close()
          ssh.close()

          if not downloaded:
              print('WARNING: expro_data.json not found on server — will try cache fallback')
              sys.exit(0)   # non-fatal, cache restore step follows
          PYEOF

      # Fallback: restore expro_data.json from GitHub Actions cache if server had nothing
      - name: Restore expro_data.json from cache (fallback)
        if: ${{ !hashFiles('data/expro_data.json') }}
        uses: actions/cache/restore@v4
        with:
          path: data/expro_data.json
          key: expro-data-${{ github.run_id }}
          restore-keys: |
            expro-data-

      - name: Check expro_data.json exists
        run: |
          if [ ! -f data/expro_data.json ]; then
            echo "ERROR: expro_data.json not available from server or cache"
            exit 1
          fi
          python3 -c "import json; d=json.load(open('data/expro_data.json')); print(f'Loaded: {len(d)} investments, {sum(len(i.get(\"units\",[]))for i in d)} units')"

      # ── amenity_data.json: persistent cache across runs ──
      - name: Restore amenity cache (amenity_data.json)
        uses: actions/cache/restore@v4
        with:
          path: data/amenity_data.json
          key: amenity-data-${{ github.run_id }}
          restore-keys: |
            amenity-data-

      - name: Show cache status
        run: |
          if [ -f data/amenity_data.json ]; then
            python3 -c "import json; d=json.load(open('data/amenity_data.json')); print(f'Amenity cache: {len(d)} units cached, {sum(1 for v in d.values() if v)} with data')"
          else
            echo "Amenity cache: empty (first run)"
          fi

      - name: Run amenity_patch.py
        env:
          EXPRO_USERNAME:   ${{ secrets.EXPRO_USERNAME }}
          EXPRO_PASSWORD:   ${{ secrets.EXPRO_PASSWORD }}
          AMENITY_WORKERS:  '5'
          EXPRO_TEST_INV_ID: ${{ github.event.inputs.expro_ids || '' }}
        run: |
          if [ -n "$EXPRO_TEST_INV_ID" ]; then
            python3 amenity_patch.py --expro-ids "$EXPRO_TEST_INV_ID"
          else
            python3 amenity_patch.py --all
          fi

      - name: Save amenity cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/amenity_data.json
          key: amenity-data-${{ github.run_id }}

      # Upload amenity_data.json to server so other tools can use it
      - name: Upload amenity_data.json to server
        if: always()
        env:
          SSH_HOST:     ${{ secrets.SSH_HOST }}
          SSH_PORT:     ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os, paramiko

          if not os.path.exists('data/amenity_data.json'):
              print('No amenity_data.json to upload')
              exit(0)

          host = os.environ['SSH_HOST']
          port = int(os.environ.get('SSH_PORT', '65002'))
          user = os.environ['SSH_USERNAME']
          pw   = os.environ['SSH_PASSWORD']

          ssh = paramiko.SSHClient()
          ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          ssh.connect(host, port=port, username=user, password=pw, timeout=30)

          sftp = ssh.open_sftp()
          remote = '/home/u525644354/expro_scraper_run/data/amenity_data.json'
          try:
              sftp.put('data/amenity_data.json', remote)
              print(f'Uploaded to {remote}')
          except Exception as e:
              print(f'Upload warning: {e}')
          sftp.close()
          ssh.close()
          PYEOF

      - name: Re-sync mieszkania with amenity data
        run: python3 run.py mieszkania

      - name: Write job summary
        if: always()
        run: |
          echo "## Amenity Patch — $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f data/amenity_data.json ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('data/amenity_data.json')); print(len(d))" 2>/dev/null)
            WITH=$(python3 -c "import json; d=json.load(open('data/amenity_data.json')); print(sum(1 for v in d.values() if v))" 2>/dev/null)
            echo "| Метрика | Значення |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Юнітів у кеші | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| З amenity даними | $WITH |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amenity-logs-${{ github.run_number }}
          path: |
            logs/
            data/amenity_data.json
          retention-days: 30
          if-no-files-found: ignore
