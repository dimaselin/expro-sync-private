name: Amenity Patch (Phase 2)

# Scrapes balcony/terrace/garden/garage/basement for ExPro units.
# Only new units (not yet in cache) are scraped each run.
# expro_data.json comes from yesterday's daily sync via GitHub Actions cache.
# amenity_data.json is a persistent cache that grows over time.

on:
  schedule:
    - cron: '0 8 * * 1'   # щопонеділка 10:00 Варшава (8:00 UTC), 2 год після daily sync
  workflow_dispatch:
    inputs:
      expro_ids:
        description: 'ExPro IDs (через кому, порожньо = всі)'
        required: false
        default: ''
        type: string

concurrency:
  group: amenity-patch
  cancel-in-progress: false

jobs:
  amenity:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip3 install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Generate config.py from secrets
        env:
          SSH_HOST:          ${{ secrets.SSH_HOST }}
          SSH_PORT:          ${{ secrets.SSH_PORT }}
          SSH_USERNAME:      ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD:      ${{ secrets.SSH_PASSWORD }}
          EXPRO_USERNAME:    ${{ secrets.EXPRO_USERNAME }}
          EXPRO_PASSWORD:    ${{ secrets.EXPRO_PASSWORD }}
          WP_PATH:           ${{ secrets.WP_PATH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL:            ${{ secrets.WP_URL }}
          WP_API_KEY:        ${{ secrets.WP_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os
          cfg = '''# Auto-generated by GitHub Actions — do not commit
          SSH = {{
              "host":     "{SSH_HOST}",
              "port":     {SSH_PORT},
              "username": "{SSH_USERNAME}",
              "password": "{SSH_PASSWORD}",
          }}
          EXPRO = {{
              "base_url":  "https://expro.expander.pl",
              "login_url": "https://expro.expander.pl/user/login",
              "username":  "{EXPRO_USERNAME}",
              "password":  "{EXPRO_PASSWORD}",
          }}
          WP = {{
              "path":        "{WP_PATH}",
              "wp_cli":      "wp",
              "post_type":   "inwestycja",
              "post_status": "publish",
              "post_author": 1,
          }}
          DATA_FILE = "data/expro_data.json"
          PREV_FILE = "data/expro_prev.json"
          LOG_FILE  = "logs/sync.log"
          ANTHROPIC_API_KEY = "{ANTHROPIC_API_KEY}"
          WP_PLUGIN = {{
              "url":     "{WP_URL}",
              "api_key": "{WP_API_KEY}",
          }}
          STATUS_MAP = {{
              "Dostepne":      "dostepne",
              "Zarezerwowane": "zarezerwowane",
              "Sprzedane":     "sprzedane",
          }}
          '''.format(
              SSH_HOST=os.environ['SSH_HOST'],
              SSH_PORT=int(os.environ.get('SSH_PORT', '65002')),
              SSH_USERNAME=os.environ['SSH_USERNAME'],
              SSH_PASSWORD=os.environ['SSH_PASSWORD'],
              EXPRO_USERNAME=os.environ['EXPRO_USERNAME'],
              EXPRO_PASSWORD=os.environ['EXPRO_PASSWORD'],
              WP_PATH=os.environ['WP_PATH'],
              ANTHROPIC_API_KEY=os.environ.get('ANTHROPIC_API_KEY', ''),
              WP_URL=os.environ['WP_URL'],
              WP_API_KEY=os.environ['WP_API_KEY'],
          )
          with open('config.py', 'w') as f:
              f.write(cfg)
          print('config.py created')
          PYEOF

      # expro_data.json: restore from cache (saved by daily expro-sync workflow).
      # Overwrites the committed baseline with yesterday's fresh scrape.
      - name: Restore expro_data.json from cache
        uses: actions/cache/restore@v4
        with:
          path: data/expro_data.json
          key: expro-data-${{ github.run_id }}
          restore-keys: |
            expro-data-

      # amenity_data.json: persistent cache — grows as more units are scraped
      - name: Restore amenity cache
        uses: actions/cache/restore@v4
        with:
          path: data/amenity_data.json
          key: amenity-data-${{ github.run_id }}
          restore-keys: |
            amenity-data-

      - name: Show data status
        run: |
          python3 - <<'EOF'
          import json, os
          if os.path.exists('data/expro_data.json'):
              d = json.load(open('data/expro_data.json'))
              units = sum(len(i.get('units',[])) for i in d)
              print(f'expro_data.json: {len(d)} investments, {units} units')
          else:
              print('ERROR: expro_data.json missing!')
              raise SystemExit(1)
          if os.path.exists('data/amenity_data.json'):
              a = json.load(open('data/amenity_data.json'))
              print(f'amenity_data.json: {len(a)} cached, {sum(1 for v in a.values() if v)} with data')
          else:
              print('amenity_data.json: empty (first run)')
          EOF

      - name: Run amenity_patch.py
        env:
          EXPRO_USERNAME:    ${{ secrets.EXPRO_USERNAME }}
          EXPRO_PASSWORD:    ${{ secrets.EXPRO_PASSWORD }}
          AMENITY_WORKERS:   '5'
        run: |
          IDS="${{ github.event.inputs.expro_ids }}"
          if [ -n "$IDS" ]; then
            python3 amenity_patch.py --expro-ids "$IDS"
          else
            python3 amenity_patch.py --all
          fi

      - name: Save amenity cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/amenity_data.json
          key: amenity-data-${{ github.run_id }}

      - name: Re-sync mieszkania with amenity data
        run: python3 run.py mieszkania

      - name: Write job summary
        if: always()
        run: |
          echo "## Amenity Patch — $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f data/amenity_data.json ]; then
            python3 - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open('data/amenity_data.json'))
          total = len(d)
          with_data = sum(1 for v in d.values() if v)
          has_balcony = sum(1 for v in d.values() if v.get('has_balcony'))
          has_terrace = sum(1 for v in d.values() if v.get('has_terrace'))
          print(f'| Юнітів у кеші | {total} |')
          print(f'| З amenity даними | {with_data} |')
          print(f'| З балконом | {has_balcony} |')
          print(f'| З терасою | {has_terrace} |')
          EOF
          fi

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amenity-logs-${{ github.run_number }}
          path: |
            logs/
            data/amenity_data.json
          retention-days: 30
          if-no-files-found: ignore
